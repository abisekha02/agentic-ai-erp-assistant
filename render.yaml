databases:
  - name: eka-db
    plan: free
services:
  - type: web
    name: eka-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn config.wsgi --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /api/health/
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: eka-db, property: connectionString }
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: FRONTEND_ORIGIN
        sync: false   # your Vercel URL, e.g. https://eka.vercel.app
      - key: OPENAI_API_KEY
        sync: false
      - key: MEDIA_ROOT
        value: /var/data/media   # attach a Render disk here; the default filesystem is ephemeral
